name: Premium signed release
on:
  push:
    branches: [feat/motazalqami-premium-verification, feat/motazalqami-android-premium-v2]
    paths: ['android/release/initialize-v2', '.github/workflows/premium-release.yml']
  pull_request:
    paths: ['android/release/initialize-v2', '.github/workflows/premium-release.yml']
  workflow_dispatch:
    inputs:
      publish_signed_release:
        description: 'Confirm that the private signing recovery key is securely saved outside GitHub'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: premium-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Use installed SDK manager
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Premium-Android-Quality
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*unsigned.apk
  ui:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {api: [26, 29]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            set -euo pipefail
            gradle -p android :app:connectedDebugAndroidTest --no-daemon
            # Gradle's connected test task can uninstall the target package after
            # instrumentation. Always install the exact APK before UI screenshots.
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p android/screenshots
            adb shell wm dismiss-keyguard
            adb shell am start -W -n com.moataz.motazalqmi/.MainActivity | tee android/screenshots/start-home.txt
            sleep 5
            adb shell pidof com.moataz.motazalqmi
            adb shell dumpsys activity activities | grep -E '(mResumedActivity|topResumedActivity).*com.moataz.motazalqmi/' | tee android/screenshots/foreground-home.txt
            adb exec-out screencap -p > android/screenshots/home.png
            adb shell am start -W -a android.intent.action.VIEW -d 'https://motazalqmi.vercel.app/articles/imru-al-qais-poetic-imagery' com.moataz.motazalqmi | tee android/screenshots/start-reader.txt
            sleep 4
            adb shell pidof com.moataz.motazalqmi
            adb shell dumpsys activity activities | grep -E '(mResumedActivity|topResumedActivity).*com.moataz.motazalqmi/' | tee android/screenshots/foreground-reader.txt
            adb exec-out screencap -p > android/screenshots/reader.png
            # A duplicate screenshot signals that the expected navigation was not shown.
            if cmp -s android/screenshots/home.png android/screenshots/reader.png; then
              echo 'Home and article screenshots are identical; failing visual smoke test.' >&2
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Premium-UI-API-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/screenshots/
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_signed_release == true
    needs: [quality, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check one-time initialization or existing release
        id: gate
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if [ ! -f android/release/initialize-v2 ]; then exit 0; fi
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; never generate a replacement signing key.'
            exit 0
          fi
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo 'A newer revision exists; publishing is reserved for its quality checks.'
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.publish == 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.publish == 'true'
        with: {gradle-version: '8.11.1'}
      - name: Select installed SDK manager
        if: steps.gate.outputs.publish == 'true'
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Initialize protected signing and publish tested release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash android/release/publish-initial.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.publish == 'true'
        with:
          name: Premium-Signed-Release-and-Encrypted-Recovery
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/release/output/signing-backup.cms
            android/release/output/signature.txt
            android/release/output/SHA256SUMS
