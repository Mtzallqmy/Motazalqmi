name: Motaz 3.5 verified release
on:
  push:
    branches: [main, release/preview-35]
    paths: ['android/**', 'src/**', 'server/**', 'shared/**', 'api/**', 'db/**', 'scripts/**', 'vercel.json', 'tests/**', 'package*.json', '.github/workflows/edition-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Chromium reading and writing checks
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1 --no-audit --no-fund
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          npm run preview -- --port 4173 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for attempt in {1..30}; do if curl -fsS http://localhost:4173 >/dev/null; then break; fi; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-3.5-verification
          path: |
            mobile-home.png
            desktop-home.png
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      signed: ${{ steps.package.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify the Edition 35 ARM64 package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE64: ${{ secrets.ANDROID_EDITION35_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_EDITION35_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_EDITION35_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_EDITION35_KEY_PASSWORD }}
        run: bash android/release/build-edition35.sh
      - uses: actions/upload-artifact@v4
        with:
          name: edition35-encrypted-signing-backup
          path: ${{ runner.temp }}/edition35-signing-backup.cms
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.signed == 'true'
        with: {name: signed-edition, path: dist/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-3.5-quality
          path: android/app/build/reports/
  older-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: {api: [26, 28, 29]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash android/gradlew -p android connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-3.5-API-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
  signed-device:
    needs: package
    if: needs.package.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: signed-edition, path: dist}
      - run: sudo chmod a+rw /dev/kvm
      - name: Install and launch the signed edition offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            (cd dist && sha256sum -c SHA256SUMS)
            adb shell getprop ro.product.cpu.abilist | grep arm64-v8a
            adb install dist/*.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n "$(cat dist/package.txt)/com.moataz.motazalqmi.MainActivity" | tee /tmp/launch
            grep -F 'Status: ok' /tmp/launch
            sleep 5
            adb shell pidof "$(cat dist/package.txt)"
            adb shell uiautomator dump /sdcard/motaz-home.xml
            adb exec-out cat /sdcard/motaz-home.xml > /tmp/motaz-home.xml
            grep -Fq 'أدبنا العربي' /tmp/motaz-home.xml
            grep -Fq 'جديد المدونة' /tmp/motaz-home.xml
            adb exec-out screencap -p > native-magazine-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: native-magazine-home
          path: native-magazine-home.png
          if-no-files-found: error
  publish:
    needs: [web, older-android, signed-device]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: signed-edition, path: dist}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -eu
          cd dist
          sha256sum -c SHA256SUMS
          tag=v3.5.0-preview.1
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          printf '%s\n' 'أول إصدار بالحزمة والتوقيع الجديدين. يثبّت بجانب ٣.٤.١، وتُثبّت الإصدارات اللاحقة التي تحمل هذا التوقيع فوقه.' 'الاسم الظاهر: معتز العلقمي. شريط إعلانات قابل للتحرير، وأبواب الإنسان والثقافة والدين واللغة. Android 8+ · ARM64.' > RELEASE-NOTES.md
          gh release create "$tag" Motazalqmi-3.5.0-ARM64.apk SHA256SUMS signature.txt package.txt -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'معتز العلقمي 3.5.0' --notes-file RELEASE-NOTES.md
