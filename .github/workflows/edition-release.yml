name: Motaz 3.5 verified release
on:
  push:
    branches: [main, feat/editorial-ticker]
    paths: ['android/**', 'src/**', 'server/**', 'shared/**', 'api/**', 'db/**', 'scripts/**', 'vercel.json', 'tests/**', 'package*.json', '.github/workflows/edition-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Chromium reading and writing checks
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1 --no-audit --no-fund
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          npm run preview -- --port 4173 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for attempt in {1..30}; do if curl -fsS http://localhost:4173 >/dev/null; then break; fi; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-3.5-verification
          path: |
            mobile-home.png
            desktop-home.png
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      signed: ${{ steps.package.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify upgrade-compatible ARM64 release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dist
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          pkg=com.moataz.motazalqmi.edition341
          flags=(-PmotazArm64Only=true -PmotazIndependentEdition=true)
          signing=missing
          if [[ -n "$KEYSTORE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" && -n "$ANDROID_KEY_ALIAS" ]]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            baseline="$RUNNER_TEMP/baseline"
            gh release download v3.4.1-independent.1 -p '*.apk' -D "$baseline"
            certificate=$("$sdk/apksigner" verify --print-certs "$baseline"/*.apk | awk '/certificate SHA-256 digest/ {print $NF;exit}')
            test "$certificate" = '3169c4c8eb6a25ad46b66d2b0d270ebf12054f862f238f6411463000068ca102'
            digest=$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)
            test "$digest" = "$certificate"
            signing=signed
          elif [[ -n "$KEYSTORE64$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_PASSWORD$ANDROID_KEY_ALIAS" ]]; then
            echo '::error::The existing preview signing key configuration is incomplete.'
            exit 1
          fi
          bash android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleRelease "${flags[@]}" --no-daemon
          if [[ "$signing" = missing ]]; then
            echo '::warning::Release signing requires the existing 3.4.1 key. No replacement key was generated.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apk="dist/Motazalqmi-3.5.0-ARM64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$sdk/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$apk" > dist/signature.txt
          grep -Fq "$certificate" dist/signature.txt
          "$sdk/zipalign" -c 4 "$apk"
          "$sdk/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
          grep -F "package: name='$pkg' versionCode='30500'" "$RUNNER_TEMP/badging"
          grep -Fx "sdkVersion:'26'" "$RUNNER_TEMP/badging"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging"
          grep -Fx "application-label:'معتز العلقمي'" "$RUNNER_TEMP/badging"
          unzip -tq "$apk"
          printf '%s' "$pkg" > dist/package.txt
          (cd dist && sha256sum *.apk > SHA256SUMS)
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.signed == 'true'
        with: {name: signed-edition, path: dist/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-3.5-quality
          path: android/app/build/reports/
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
  older-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: {api: [26, 28, 29]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash android/gradlew -p android connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-3.5-API-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
  signed-device:
    needs: package
    if: needs.package.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: signed-edition, path: dist}
      - name: Download the previous signed installation
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release download v3.4.1-independent.1 -p '*.apk' -D "$RUNNER_TEMP/baseline"
      - run: sudo chmod a+rw /dev/kvm
      - name: Upgrade the previous installation and verify offline launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            (cd dist && sha256sum -c SHA256SUMS)
            adb shell getprop ro.product.cpu.abilist | grep arm64-v8a
            adb install "$RUNNER_TEMP"/baseline/*.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n "$(cat dist/package.txt)/com.moataz.motazalqmi.MainActivity"
            sleep 5
            adb install -r dist/*.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n "$(cat dist/package.txt)/com.moataz.motazalqmi.MainActivity" | tee /tmp/launch
            grep -F 'Status: ok' /tmp/launch
            sleep 5
            adb shell pidof "$(cat dist/package.txt)"
            adb shell uiautomator dump /sdcard/motaz-home.xml
            adb exec-out cat /sdcard/motaz-home.xml > /tmp/motaz-home.xml
            grep -Fq 'أدبنا العربي' /tmp/motaz-home.xml
            adb exec-out screencap -p > native-magazine-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: native-magazine-home
          path: native-magazine-home.png
          if-no-files-found: error
  publish:
    needs: [web, older-android, signed-device]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: signed-edition, path: dist}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -eu
          cd dist
          sha256sum -c SHA256SUMS
          tag=v3.5.0-preview.1
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          printf '%s\n' 'يتثبّت فوق نسخة ٣.٤.١ بالتوقيع ومعرّف الحزمة نفسيهما.' 'الاسم الظاهر: معتز العلقمي. شريط إعلانات قابل للتحرير، وأبواب الإنسان والثقافة والدين واللغة. Android 8+ · ARM64.' > RELEASE-NOTES.md
          gh release create "$tag" * -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'معتز العلقمي 3.5' --notes-file RELEASE-NOTES.md
