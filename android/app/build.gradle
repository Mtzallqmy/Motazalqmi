plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
 id 'org.jetbrains.kotlin.plugin.compose'
 id 'com.google.devtools.ksp'
 id 'com.google.dagger.hilt.android'
}
android {
 namespace 'com.moataz.motazalqmi'
 compileSdk 35
 defaultConfig {
  applicationId 'com.moataz.motazalqmi'
  minSdk 26
  targetSdk 35
  // Build a downloadable ARM64-only Debug APK without restricting x86 emulator tests.
  // The normal Debug variant remains cross-architecture for CI device tests.
  if (project.findProperty('motazArm64Only') == 'true') {
   ndk { abiFilters 'arm64-v8a' }
  }
  versionCode 20000
  versionName '2.0.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { compose true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 signingConfigs {
  if (System.getenv('ANDROID_KEYSTORE_PATH')) {
   production {
    storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('ANDROID_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   ndk { abiFilters 'arm64-v8a' }
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
   signingConfig signingConfigs.findByName('production')
  }
 }
 testOptions { unitTests.includeAndroidResources = true; unitTests.all { maxHeapSize = "512m" } }
 lint { abortOnError true }
 packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.12.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-extended'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 debugImplementation 'androidx.compose.ui:ui-tooling'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'androidx.navigation:navigation-compose:2.8.5'
 implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
 implementation 'com.google.dagger:hilt-android:2.52'
 ksp 'com.google.dagger:hilt-compiler:2.52'
 implementation 'androidx.room:room-runtime:2.6.1'
 implementation 'androidx.room:room-ktx:2.6.1'
 ksp 'androidx.room:room-compiler:2.6.1'
 implementation 'androidx.datastore:datastore-preferences:1.1.1'
 implementation 'androidx.work:work-runtime-ktx:2.9.1'
 implementation 'com.squareup.retrofit2:retrofit:2.11.0'
 implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'io.coil-kt:coil-compose:2.7.0'
 implementation 'io.noties.markwon:core:4.6.2'
 implementation 'io.noties.markwon:ext-tables:4.6.2'
 implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'androidx.test:core:1.6.1'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.room:room-testing:2.6.1'
 androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
