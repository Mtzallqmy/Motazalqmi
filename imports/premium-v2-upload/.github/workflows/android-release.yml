name: Android Premium v2 CI & Signed Release APK

on:
  push:
    branches: [ "feat/motazalqami-android-premium-v2", "main" ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run API v1 unit tests
        run: node --test api/tests/api.v1.test.mjs

  android-build-release:
    needs: api-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Build arm64-v8a Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK Signature (when keystore provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*arm64-v8a-release.apk" | head -n 1)
          $ANDROID_HOME/build-tools/*/apksigner verify --verbose "$APK"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motazalqmi-v2.0.0-arm64-v8a-release
          path: android/app/build/outputs/apk/release/*.apk
